name: Build APK do VTR Motoboy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar o Java (necessário pro Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar as dependências do projeto
        run: npm install

      - name: Copiar os arquivos do app pro projeto Android
        run: npx cap sync android

      - name: Compilar o APK (versão de teste, instala direto sem precisar de loja de aplicativos)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK pronto pra download
        uses: actions/upload-artifact@v4
        with:
          name: vtr-motoboy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
